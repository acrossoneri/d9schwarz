name: Update data

# Runs the scraper and commits the refreshed table + fixtures.
#
# The matchcenter is behind Cloudflare. A patient headless browser gets through,
# but GitHub's datacenter IP is occasionally challenged, so the scrape step is
# BEST-EFFORT: if it can't get through, the run keeps the previous data instead of
# failing (no error emails).
#
# Besides the group schedule the scraper opens each game's Spieldetail page for the
# Aufstellung, Spielort and Drittelsresultate — one look the day before for the
# Spielort, then from 4h after kickoff every 2h until the line-up is there;
# everyone else's once their weekend is over.
# Those pages are not always served; the scraper stops at the first refusal, so a
# fruitless run costs one request rather than a dozen.
#
# The published data files are encrypted, so the scraper needs the site
# credentials. Set them under Settings -> Secrets and variables -> Actions:
#   SITE_USER, SITE_PASSWORD
# Times are UTC (Swiss local = UTC+1 winter / +2 summer).
on:
  schedule:
    # Every two hours. A game's result lands within two hours of the referee filing
    # it, which is as fast as it gets — the matchcenter has nothing to give us in
    # between, and an unchanged scrape produces no commit anyway. The old hourly
    # beat plus a 20-minute Saturday burst meant ~60 runs a match day for maybe two
    # changes.
    - cron: "0 */2 * * *"
  workflow_dispatch:            # manual trigger from the Actions tab

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write            # allow committing the refreshed data back
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -r scraper/requirements.txt
          python -m playwright install --with-deps chromium

      - name: Scrape matchcenter (best effort)
        timeout-minutes: 25       # a hung Cloudflare challenge must not burn the hour
        env:
          SITE_USER: ${{ secrets.SITE_USER }}
          SITE_PASSWORD: ${{ secrets.SITE_PASSWORD }}
        run: |
          python scraper/scrape.py \
            || echo "::warning::Scrape failed (Cloudflare?) — keeping previous data."

      - name: Commit if data changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/matches.enc.json data/standings.enc.json
          if git diff --staged --quiet; then
            echo "No changes."
          else
            git commit -m "data: auto-update $(date -u +'%Y-%m-%d %H:%M UTC')"
            git push
          fi
