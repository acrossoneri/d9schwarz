name: Import once

# One-shot: takes the prepared data out of the IMPORT_PAYLOAD_B64 secret, encrypts
# it with the site credentials the repository already holds, and commits the
# resulting data files. Nothing in plaintext ever reaches the repository or the log —
# the payload arrives as a secret, which Actions masks.
#
# Delete this workflow and the secret once it has run.

on:
  workflow_dispatch:

jobs:
  import:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install cryptography

      - name: Write the encrypted data files
        env:
          SITE_USER: ${{ secrets.SITE_USER }}
          SITE_PASSWORD: ${{ secrets.SITE_PASSWORD }}
          PAYLOAD_B64: ${{ secrets.IMPORT_PAYLOAD_B64 }}
        run: |
          python - <<'PY'
          import base64, json, os, sys
          from datetime import datetime, timezone
          sys.path.insert(0, "scraper")
          import sitecrypt

          payload = json.loads(base64.b64decode(os.environ["PAYLOAD_B64"]))
          key, _role = sitecrypt.unlock()
          now = datetime.now(timezone.utc).astimezone().strftime("%Y-%m-%d %H:%M")

          for name in ("lineups", "players", "friendlies", "scorers"):
              if name not in payload:
                  continue
              sitecrypt.write_encrypted(name, key, payload[name], now)
              # Counts only — never the contents.
              body = payload[name]
              size = len(body.get("byMatch", body.get("matches", body.get("players", []))))
              print(f"  {name}.enc.json geschrieben ({size} Einträge)")
          PY

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/*.enc.json
          if git diff --staged --quiet; then
            echo "Keine Änderung."
          else
            git commit -m "data: Spielberichte und Torschützen eingelesen"
            git push
          fi
